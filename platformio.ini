; CRYPTLINGS firmware. Two boards from one codebase:
;   pio run -e esp32-c6     Waveshare ESP32-C6-Touch-LCD-1.47 (172 x 320 rectangle)
;   pio run -e stopwatch    M5Stack StopWatch (466 x 466 round AMOLED)
[platformio]
default_envs = esp32-c6

; ---- Waveshare ESP32-C6-Touch-LCD-1.47 ----
; The ESP32-C6 needs Arduino core 3.x, which comes from the pioarduino platform.
; Pinned to the release this firmware was built and checked with (Arduino core 3.3.12).
[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
; The board has 8MB flash; the stock table is a 4MB layout.
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
  -std=gnu++17
  ; The C6 talks over its built-in USB Serial/JTAG port, not UART0.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Optional NTP: -DWIFI_SSID=\"name\" -DWIFI_PASS=\"pass\"
build_unflags = -std=gnu++11
build_src_filter = +<*> -<main_stopwatch.cpp>

; ---- M5Stack StopWatch (ESP32-S3R8: 8 MB PSRAM, 16 MB flash) ----
; Board settings follow M5Stack's StopWatch quick start, but on the same
; pioarduino platform as the C6 (Arduino core 3.x): two different espressif32
; platforms in one project fight over the shared framework package. M5Unified
; drives the display, touch, keys, speaker, vibration, battery, RTC and IMU.
[env:stopwatch]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32s3box
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
monitor_speed = 115200
build_flags =
  -std=gnu++17
  -DCRYPT_ROUND=1
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Optional NTP: -DWIFI_SSID=\"name\" -DWIFI_PASS=\"pass\"
  ; Motion axes, if tilting feels wrong (see src/main_stopwatch.cpp): e.g. -DACC_X=(-ay) -DACC_Y=(ax)
build_unflags = -std=gnu++11
build_src_filter = +<*> -<main.cpp> -<hal/>
lib_deps =
  M5Unified=https://github.com/m5stack/M5Unified#0.2.27
  M5GFX=https://github.com/m5stack/M5GFX#0.2.34
