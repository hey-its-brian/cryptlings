; CRYPTLINGS firmware, Waveshare ESP32-C6-Touch-LCD-1.47
; The ESP32-C6 needs Arduino core 3.x, which comes from the pioarduino platform.
; Pinned to the release this firmware was built and checked with (Arduino core 3.3.12).
[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
; The board has 8MB flash; the stock table is a 4MB layout.
board_build.partitions = default_8MB.csv
monitor_speed = 115200
build_flags =
  -std=gnu++17
  ; The C6 talks over its built-in USB Serial/JTAG port, not UART0.
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; Optional NTP: -DWIFI_SSID=\"name\" -DWIFI_PASS=\"pass\"
build_unflags = -std=gnu++11
