; CRYPTLINGS firmware, Waveshare ESP32-C6-Touch-LCD-1.47
; The ESP32-C6 needs Arduino core 3.x, which comes from the pioarduino platform.
[env:esp32-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -std=gnu++17
  ; Optional NTP: -DWIFI_SSID=\"name\" -DWIFI_PASS=\"pass\"
build_unflags = -std=gnu++11
